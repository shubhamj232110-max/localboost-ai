<div class="lb-chatbot" id="lbChatbot">
  <button
    class="lb-chat-launcher"
    id="lbChatLauncher"
    type="button"
    aria-label="LocalBoost AI chat kholen"
    aria-expanded="false"
    aria-controls="lbChatWindow"
  >
    <span class="lb-chat-icon" aria-hidden="true">✦</span>
    <span class="lb-chat-pulse" aria-hidden="true"></span>
  </button>

  <section
    class="lb-chat-window"
    id="lbChatWindow"
    role="dialog"
    aria-labelledby="lbChatTitle"
    aria-hidden="true"
    tabindex="-1"
  >
    <header class="lb-chat-header">
      <div class="lb-chat-avatar" aria-hidden="true">LB</div>

      <div class="lb-chat-heading">
        <strong id="lbChatTitle">LocalBoost AI</strong>
        <span class="lb-chat-status-line">
          <i class="lb-chat-status-dot" aria-hidden="true"></i>
          <span id="lbChatStatus" role="status" aria-live="polite">
            Ready to help
          </span>
        </span>
      </div>

      <button
        class="lb-chat-new"
        id="lbChatNew"
        type="button"
        aria-label="Nayi chat shuru karein"
        title="New chat"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>

      <button
        class="lb-chat-close"
        id="lbChatClose"
        type="button"
        aria-label="Chat band karein"
      >
        <span aria-hidden="true">×</span>
      </button>
    </header>

    <div
      class="lb-chat-body"
      id="lbChatBody"
      role="log"
      aria-live="polite"
      aria-relevant="additions text"
      aria-label="Chat messages"
    ></div>

    <div
      class="lb-chat-quick-actions"
      id="lbChatQuickActions"
      aria-label="Suggested questions"
    >
      <button type="button" data-question="Namaste">
        Namaste
      </button>

      <button
        type="button"
        data-question="LocalBoost AI kya karta hai?"
      >
        LocalBoost kya hai?
      </button>

      <button
        type="button"
        data-question="Mujhe gym ke liye marketing idea do"
      >
        Gym marketing
      </button>

      <button
        type="button"
        data-question="Mujhe Instagram caption likhne mein help chahiye"
      >
        Caption help
      </button>

      <button
        type="button"
        data-question="Mujhe padhai mein help chahiye"
      >
        Padhai help
      </button>

      <button
        type="button"
        data-question="Ek joke sunao"
      >
        Joke sunao
      </button>
    </div>

    <form class="lb-chat-form" id="lbChatForm">
      <label class="visually-hidden" for="lbChatInput">
        Apna message likhein
      </label>

      <input
        id="lbChatInput"
        name="message"
        type="text"
        placeholder="Kuch bhi poochhein..."
        autocomplete="off"
        maxlength="2000"
        aria-label="Apna message likhein"
      >

      <button
        id="lbChatSend"
        type="submit"
        aria-label="Message bhejein"
        title="Send"
      >
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
      </button>
    </form>

    <p class="lb-chat-disclaimer">
      Yeh saved answers dhoondhta hai, full AI nahi. Sensitive details share na karein.
    </p>
  </section>
</div>
