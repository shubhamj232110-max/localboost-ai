<div class="lb-chatbot" id="lbChatbot">
  <button
    class="lb-chat-launcher"
    id="lbChatLauncher"
    type="button"
    aria-label="Open LocalBoost AI chat"
    aria-expanded="false"
  >
    <span class="lb-chat-icon">✦</span>
    <span class="lb-chat-pulse"></span>
  </button>

  <section
    class="lb-chat-window"
    id="lbChatWindow"
    aria-label="LocalBoost AI chat"
    aria-hidden="true"
  >
    <header class="lb-chat-header">
      <div class="lb-chat-avatar">LB</div>

      <div class="lb-chat-heading">
        <strong>LocalBoost AI</strong>
        <span><i></i><span id="lbChatStatus">Ready to help</span></span>
      </div>

      <button
        class="lb-chat-new"
        id="lbChatNew"
        type="button"
        aria-label="Start a new chat"
        title="New chat"
      >
        <i class="bi bi-plus-lg" aria-hidden="true"></i>
      </button>

      <button
        class="lb-chat-close"
        id="lbChatClose"
        type="button"
        aria-label="Close chat"
      >
        ×
      </button>
    </header>

    <div class="lb-chat-body" id="lbChatBody" aria-live="polite"></div>

    <div class="lb-chat-quick-actions" id="lbChatQuickActions">
      <button type="button" data-question="Home page kholo">
        Home
      </button>

      <button type="button" data-question="Who is Shubham Jaiswal?">
        Who is Shubham Jaiswal?
      </button>

      <button type="button" data-question="Pricing page kholo">
        Pricing
      </button>

      <button type="button" data-question="Gym Plan page kholo">
        Gym plan
      </button>

      <button type="button" data-question="What is LocalBoost AI? Simple mein samjhao.">
        What is LocalBoost AI?
      </button>

      <button type="button" data-question="Features page kholo">
        Features
      </button>

      <button type="button" data-question="How it works page kholo">
        How it works
      </button>

      <button type="button" data-question="Ek joke sunao.">
        Joke sunao
      </button>

      <button type="button" data-question="Shubham Jaiswal ke goals kya hain?">
        Shubham ke goals
      </button>
    </div>

    <form class="lb-chat-form" id="lbChatForm">
      <input
        id="lbChatInput"
        type="text"
        placeholder="Kuch bhi poochhein..."
        autocomplete="off"
        maxlength="2000"
        aria-label="Type your message"
      >
      <button type="submit" aria-label="Send message">↑</button>
    </form>

    <p class="lb-chat-disclaimer">
      shubham jaiswal, LocalBoost AI ke founder, aapke sawalon ka jawab dene ke liye yahan hai.
    </p>
  </section>
</div>
